<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Brewly Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main id="login-view" class="login-wrap">
    <section class="login-card">
      <h1>Brewly Admin</h1>
      <form id="login-form">
        <label>Username
          <input id="login-username" type="text" autocomplete="username" required>
        </label>
        <label>Password
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn">Log in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
  </main>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">Brewly<span>Admin</span></div>
      <nav class="side-nav" id="side-nav">
        <button type="button" data-view="home" class="active">Home</button>
        <button type="button" data-view="products">Products</button>
        <button type="button" data-view="orders">Orders</button>
        <button type="button" data-view="customers">Customers</button>
        <button type="button" data-view="settings">Settings</button>
      </nav>
      <div class="user-chip">
        <span id="welcome"></span>
        <button type="button" id="logout-button" class="btn btn-ghost">Log out</button>
      </div>
    </aside>

    <main class="main">
      <section id="view-home" class="view">
        <h1>Overview</h1>
        <div class="stat-grid" id="stat-grid"></div>
        <div class="dash-grid">
          <div class="card span-2">
            <div class="card-head">
              <h2>Sales by month</h2>
              <div class="toggle" id="chart-toggle">
                <button type="button" data-metric="revenue" class="active">Revenue</button>
                <button type="button" data-metric="orders">Orders</button>
              </div>
            </div>
            <div id="chart-box"></div>
          </div>
          <div class="card">
            <h2>Orders by status</h2>
            <div id="donut-box"></div>
          </div>
          <div class="card">
            <h2>Bestsellers</h2>
            <div id="best-box"></div>
          </div>
          <div class="card span-2">
            <h2>Latest orders</h2>
            <div id="recent-box"></div>
          </div>
        </div>
      </section>

      <section id="view-products" class="view" hidden>
        <h1>Products</h1>
        <div class="card">
          <h2>Add a product</h2>
          <form id="product-form">
            <label>Name
              <input id="product-name" type="text" maxlength="100" required>
            </label>
            <label>Description
              <textarea id="product-description" maxlength="1000" rows="3"></textarea>
            </label>
            <label>Price (USD)
              <input id="product-price" type="number" min="0" step="0.01" required>
            </label>
            <label>Image (JPG, PNG or WebP, up to 2 MB)
              <input id="product-image" type="file" accept="image/jpeg,image/png,image/webp">
            </label>
            <button type="submit" class="btn">Add product</button>
            <p id="product-message" class="message" role="status"></p>
          </form>
        </div>
        <div class="card">
          <h2>All products</h2>
          <div id="product-list"></div>
        </div>
      </section>

      <section id="view-orders" class="view" hidden>
        <h1>Orders</h1>
        <div class="filters" id="order-filters"></div>
        <div id="orders-box"></div>
      </section>

      <section id="view-customers" class="view" hidden>
        <h1>Customers</h1>
        <div class="card">
          <div id="customers-box"></div>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <h1>Settings</h1>
        <div class="card">
          <h2>Add another admin</h2>
          <form id="admin-form">
            <label>Username (3+ characters)
              <input id="new-admin-username" type="text" minlength="3" maxlength="50" autocomplete="off" required>
            </label>
            <label>Password (8+ characters)
              <input id="new-admin-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            </label>
            <button type="submit" class="btn">Create admin</button>
            <p id="admin-message" class="message" role="status"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
